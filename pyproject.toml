[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecotrust-flids"
version = "0.1.0"
description = "Trust-aware incremental federated intrusion detection with adaptive embedding and energy-saving agentic control."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "EcoTrust-FLIDS Research Team" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "pyarrow>=15.0",
  "joblib>=1.3",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "seaborn>=0.13",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2",
  "shap>=0.45",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
